name: CI

# Chạy trên mọi push vào main và mọi Pull Request. Với PR từ người ngoài, hãy bật
# Settings -> Actions -> "Require approval for all outside collaborators" để
# workflow chỉ chạy sau khi bạn duyệt.
#
# KHÔNG BAO GIỜ đổi sang `pull_request_target`: trigger đó chạy với quyền và
# secret của repo, mà checkout code của PR vào đó là trao repo cho người lạ.
on:
  push:
    branches: [main]
  pull_request:

# Push liên tiếp trên cùng một nhánh: hủy lần chạy cũ, chỉ giữ lần mới nhất
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu: CI chỉ đọc code, không ghi gì lên repo
permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 24 = LTS đang hoạt động (bản chính). 22 vẫn giữ vì engines cho phép
        # >=22 (hyperframes đòi >=22). Ghi số major để luôn lấy bản vá mới nhất -
        # đợt vá bảo mật Node 21/10/2026 cần >= 22.23.4 / 24.22.1.
        node: [24, 22]
    steps:
      # Action bên thứ ba ghim theo SHA đầy đủ (tag dời được, SHA thì không).
      # Dependabot (.github/dependabot.yml) tự mở PR nâng SHA + comment phiên bản.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Không để lại token GitHub trong .git/config cho các bước sau (npm ci
          # chạy install script của dependency)
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # Ghi số major chưa đủ: runner có sẵn Node trong cache (vd 24.21.0, thấp
          # hơn engines ^24.22.1) và setup-node dùng luôn bản đó. check-latest bắt
          # nó hỏi bản mới nhất của major - đúng bản đã vá như comment ở matrix.
          check-latest: true

      # npm ci (không phải npm install): cài đúng theo package-lock.json và
      # fail nếu lockfile lệch package.json - đúng thứ cần bắt ở PR
      - run: npm ci

      # Advisory mới (mức high trở lên) trong dependency chạy thật thì CI đỏ.
      # Chỉ chạy một lần (Node 24) - kết quả không phụ thuộc phiên bản Node.
      - name: Audit production dependencies
        if: matrix.node == 24
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (server + web + remotion)
        run: npm run typecheck

      - name: Build (server + web)
        run: npm run build

# KHÔNG chạy render thật ở đây: việc đó cần FFmpeg, Chrome, GPU và khóa
# Claude/Gemini. Đưa khóa thật vào CI vừa tốn tiền vừa rủi ro lộ, nên CI chỉ
# gác phần kiểm được tĩnh. Phần hình ảnh/âm thanh vẫn phải người xem và duyệt.
